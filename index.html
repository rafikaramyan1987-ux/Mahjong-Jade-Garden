<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7f5d" />
    <title>Mahjong Jade Garden</title>
    <style>
      #boot{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse at 50% 40%,#3d9a72,#1f6a4b 70%);color:#fff8e6;font:700 30px Georgia,'Times New Roman',serif;text-align:center;transition:opacity .35s}
      #boot small{display:block;font-size:15px;letter-spacing:.4em;color:#ecca7c;margin-bottom:6px}
      #boot .b{width:min(300px,70vw);height:14px;border-radius:8px;background:rgba(0,0,0,.28);border:2px solid #163326;overflow:hidden}
      #boot i{display:block;height:100%;width:8%;border-radius:6px;background:linear-gradient(90deg,#6fdca3,#f2cf6a);transition:width .3s;animation:bootcrawl 6s cubic-bezier(.1,.6,.3,1) forwards}
      @keyframes bootcrawl{to{width:62%}}
      body[data-ready="1"] #boot{opacity:0;pointer-events:none}
    </style>
  </head>
  <body>
    <div id="boot" data-testid="loading"><div><small>MAHJONG</small>Jade Garden</div><div class="b"><i></i></div></div>
    <canvas id="bg"></canvas>
    <canvas id="board"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
