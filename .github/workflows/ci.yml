name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Every language file has every English key (and the bundled fonts cover every character)
        run: npm run check:i18n
      - name: Unit tests (rules, solvable deals, solver)
        run: npm test
      - run: npm run build
      - name: Portal builds (each build contains only its own SDK)
        run: |
          npm run build:gd
          npm run build:crazygames
          grep -q html5.api.gamedistribution.com dist-gd/index.html
          ! grep -q sdk.crazygames.com dist-gd/index.html
          grep -q sdk.crazygames.com dist-crazygames/index.html
          ! grep -q html5.api.gamedistribution.com dist-crazygames/index.html
          ! grep -q html5.api.gamedistribution.com dist/index.html
          ! grep -q sdk.crazygames.com dist/index.html
      - name: GameDistribution zip (game id, index.html at the root, GD SDK once, no CrazyGames SDK)
        run: |
          # the committed submission zips (v1 kept, v2 current)
          node scripts/check-gd-zip.mjs submission-gd/mahjong-jade-garden-gd-v1.zip
          node scripts/check-gd-zip.mjs submission-gd/mahjong-jade-garden-gd-v2.zip
          # and a zip made the same way from this commit's GD build
          (cd dist-gd && zip -q -X -9 ../gd-ci.zip index.html)
          node scripts/check-gd-zip.mjs gd-ci.zip
      - name: Layout audit + playtest bot (every journey and daily deal solver-verified, portrait tiles >= 34 px)
        run: npm run audit
      - uses: actions/upload-artifact@v6
        with:
          name: audit
          path: docs/audit.md
      - name: Single-file build size (< 5 MB)
        run: for f in dist dist-gd dist-crazygames; do test $(stat -c%s $f/index.html) -lt 5000000; done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: e2e of the web build (onboarding, tutorial, combos, stars, stuck, settings, keyboard, journey, tile sizes)
        run: npx playwright test --trace off --grep-invert "texts fit"
      - name: Sound effects within ±2 dB of each other, music 10-16 dB under them
        run: node scripts/audio-levels.mjs --strict
      - run: npm run build:gd
      - name: e2e of the GD build with a mocked SDK (ad rules, rewards, no-SDK fallback)
        run: npm run test:e2e:gd
      - run: npm run build:crazygames
      - name: e2e of the CrazyGames build with a mocked SDK v3
        run: npm run test:e2e:cg

  textfit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Every text fits in all 10 languages at 390x844 and 1920x1080 (German and Russian included)
        run: npx playwright test --trace off tests/e2e/textfit.spec.ts

  crazygames-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: CrazyGames v2 zip (one folder with index.html, CrazyGames SDK only)
        run: |
          test "$(unzip -Z1 submission/mahjong-jade-garden-v2.zip | tr '\n' ',')" = "mahjong-jade-garden-v2/,mahjong-jade-garden-v2/index.html,"
          unzip -p submission/mahjong-jade-garden-v2.zip mahjong-jade-garden-v2/index.html > cg.html
          grep -q sdk.crazygames.com cg.html
          ! grep -q html5.api.gamedistribution.com cg.html
          ! grep -q integration.gamepix.com cg.html
          test $(stat -c%s cg.html) -lt 5000000

  gamepix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:gamepix
      - name: GamePix zip (index.html at the root, GamePix SDK once, no CrazyGames / GameDistribution code, no other URL)
        run: |
          # a zip made the same way as the submission zip from this commit's GamePix build
          (cd dist-gamepix && zip -q -X -9 ../gamepix-ci.zip index.html)
          node scripts/check-gamepix-zip.mjs gamepix-ci.zip
          # and the committed submission zips (v1, v2 kept, v3 current)
          node scripts/check-gamepix-zip.mjs submission-gamepix/mahjong-jade-garden-gamepix-v1.zip
          node scripts/check-gamepix-zip.mjs submission-gamepix/mahjong-jade-garden-gamepix-v2.zip
          node scripts/check-gamepix-zip.mjs submission-gamepix/mahjong-jade-garden-gamepix-v3.zip
          test $(stat -c%s dist-gamepix/index.html) -lt 5000000
      - name: GamePix build and newest zip declare GamePix.soundOff / soundOn and call GamePix.lang() (Player checks)
        run: |
          newest=$(ls submission-gamepix/mahjong-jade-garden-gamepix-v*.zip | sort -V | tail -n 1)
          unzip -p "$newest" index.html > gamepix-newest.html
          for f in dist-gamepix/index.html gamepix-newest.html; do
            grep -qE 'GamePix\.soundOff[[:space:]]*=' $f || { echo "$f: no GamePix.soundOff= assignment"; exit 1; }
            grep -qE 'GamePix\.soundOn[[:space:]]*=' $f || { echo "$f: no GamePix.soundOn= assignment"; exit 1; }
            grep -qE 'GamePix\.lang[[:space:]]*\([[:space:]]*\)' $f || { echo "$f: no GamePix.lang() call"; exit 1; }
          done
          echo "OK: dist-gamepix/index.html and $newest"
      - name: The other builds never contain the GamePix SDK
        run: |
          npm run build
          npm run build:gd
          npm run build:crazygames
          for f in dist dist-gd dist-crazygames; do ! grep -q integration.gamepix.com $f/index.html; ! grep -q GamePixConfig $f/index.html; done
      - name: Layout audit of the GamePix board shapes (the Lily Pad board replaces the cross-shaped one)
        run: npm run audit:gamepix

  web:
    # open portals (itch.io, Newgrounds, Y8, Playgama): the ad-free web build as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Web build + zip
        run: npm run build:web && node scripts/web/zip.mjs ci-web/mahjong-jade-garden-web.zip
      - name: Web zip checks (index.html at the root, no crazygames / gamedistribution / gamepix / googlesyndication, no http(s) request at runtime, iframe 640x480 / 960x600 / 1280x720 / 390x844, board 1 played)
        run: node scripts/web/check.mjs ci-web/mahjong-jade-garden-web.zip --shots ci-web/checks
      - name: Committed zip (submission-web/mahjong-jade-garden-web-v1.zip) passes the same file checks
        run: node scripts/web/check.mjs submission-web/mahjong-jade-garden-web-v1.zip --static
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-zip-checks
          path: ci-web/

  playgama:
    # Playgama: the build with Playgama Bridge 2.4.1 (vendor/playgama-bridge/) as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playgama build
        run: npm run build:playgama
      - name: Playgama zip checks (index.html at the root, Bridge script referenced first in <head>, pinned Bridge build, no crazygames / gamedistribution / gamepix, Playgama's precheck)
        run: node scripts/playgama/zip.mjs ci-playgama/mahjong-jade-garden-playgama.zip && node scripts/playgama/check.mjs ci-playgama/mahjong-jade-garden-playgama.zip
      - name: Committed zip (submission-playgama/mahjong-jade-garden-playgama-v1.zip) passes the same checks
        run: node scripts/playgama/check.mjs submission-playgama/mahjong-jade-garden-playgama-v1.zip
      - name: Bridge test (mock platform + stubbed Playgama SDK; interstitial, rewarded completed / cancelled, muted during ads)
        run: node scripts/playgama/test.mjs ci-playgama/mahjong-jade-garden-playgama.zip
      - name: Vendored Bridge = official v2.4.1 standalone playgama build (rebuilt from the tag)
        run: bash scripts/playgama/build-bridge.sh
      - name: The other builds never contain Playgama Bridge
        run: |
          npm run build
          npm run build:gd
          npm run build:crazygames
          npm run build:gamepix
          for f in dist dist-gd dist-crazygames dist-gamepix; do if grep -q playgama-bridge $f/index.html || test -e $f/playgama-bridge.js; then echo "$f has Playgama Bridge"; exit 1; fi; done
